services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocupa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocupa}
      POSTGRES_DB: ${POSTGRES_DB:-ocupa}
    ports:
      - "5432:5432"
    volumes:
      - ocupa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-ocupa_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-ocupa_test}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-ocupa_test}
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ocupa_postgres_data:
