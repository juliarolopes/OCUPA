[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocupa-backend"
version = "0.1.0"
description = "Backend foundation for OCUPA"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.5,<3",
  "pwdlib[argon2]>=0.3,<1",
  "PyJWT>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
